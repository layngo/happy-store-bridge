# Cloudflare Worker — static assets (dist/) + compiled Pages Functions (worker-dist/).
# Workers Builds (Git) in the dashboard:
#   Build command:  npm run build
#   Deploy command: npx wrangler deploy
name = "happy-store-bridge"
compatibility_date = "2024-09-23"
main = "./worker-dist/index.js"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Serve layngo.com from this Worker (overrides Lovable once deployed).
[[routes]]
pattern = "layngo.com/*"
zone_name = "layngo.com"

[[routes]]
pattern = "www.layngo.com/*"
zone_name = "layngo.com"
