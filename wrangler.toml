# Cloudflare Worker — static assets (dist/) + compiled API routes (worker-dist/).
#
# Workers Builds (Git) — dashboard settings:
#   Build variable:  SKIP_DEPENDENCY_INSTALL = true
#   Build command:   npm run cf:build
#   Deploy command:  npm run deploy
#
# Do NOT use `bun run build` — bun.lock is not in this repo. Use npm only.
# Do NOT use bare `npx wrangler deploy` without `npm run build` first (needs worker-dist/).
name = "happy-store-bridge"
compatibility_date = "2024-09-23"
main = "./worker-dist/index.js"

[assets]
directory = "./dist"
not_found_handling = "single-page-application"

# Custom domain routes (layngo.com) removed — site stays on Lovable.
# Attach api.layngo.com via Worker dashboard → Domains when ready.
